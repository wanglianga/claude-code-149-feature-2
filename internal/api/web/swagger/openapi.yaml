openapi: 3.0.3
info:
  title: 城市体育馆 · 羽毛球场地预约 / 灯控 / 计费 / 爽约处罚服务
  version: 1.0.0
  description: >
    后端服务（Go + PostgreSQL + Redis）。覆盖预约下单、支付与超时释放、闸机放行、
    灯控预热/开灯/关灯、前台签到、延时与拼场超员计费、退订规则、爽约/迟到/场馆原因裁决、
    场地维护锁定、临时加场、会员权益抵扣、客服争议处理。所有状态变化写入统一事件日志，
    客服可通过 timeline 接口查看预约、支付、闸机、灯控、前台操作与维护记录。


servers:
  - url: /api/v1
    description: 默认前缀（内部任务为 /internal，Swagger 静态资源为 /swagger）

tags:
  - name: auth
    description: 注册与登录
  - name: catalog
    description: 场馆、场地、排期、报价
  - name: bookings
    description: 预约、支付、退订、场次与现场灰度操作
  - name: devices
    description: 闸机与灯控设备端
  - name: operator
    description: 场馆运营（维护、加场、规则、场地定价）
  - name: relocation
    description: 场地维护临时换场（候选方案、换场/顺延/退款、闸机灯控权限同步、清场提醒）
  - name: cs
    description: 客服争议处理
  - name: internal
    description: 后台任务与测试时钟（非业务 API）

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [internal]
      security: []
      summary: 健康检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: 会员注册
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReq' }
      responses:
        '201': { description: 注册成功 }
        '409': { description: 手机号已注册 }
  /auth/login/member:
    post:
      tags: [auth]
      security: []
      summary: 会员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "13800000002" }
                password: { type: string, example: "123456" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
  /auth/login/staff:
    post:
      tags: [auth]
      security: []
      summary: 员工登录（operator/front/cs）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, enum: [operator, front, cs] }
                password: { type: string, example: operator123 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }

  /venues:
    get:
      tags: [catalog]
      security: []
      summary: 场馆列表
      responses:
        '200': { description: OK }
  /venues/{venueId}/courts:
    get:
      tags: [catalog]
      security: []
      summary: 场地列表
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /venues/{venueId}/schedule:
    get:
      tags: [catalog]
      security: []
      summary: 某场地某天 30 分钟粒度排期（free/booked/maintenance/closed，含高峰标记）
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: court_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: day, in: query, required: true, schema: { type: string, format: date, example: '2026-10-04' } }
      responses:
        '200': { description: OK }
  /quotes:
    post:
      tags: [catalog]
      security: []
      summary: 下单前报价（高峰分段、会员折扣、权益抵扣预览）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, member_id, start_time, end_time]
              properties:
                venue_id: { type: integer, format: int64 }
                court_id: { type: integer, format: int64, description: 可选，按场地专属价报价 }
                member_id: { type: integer, format: int64 }
                start_time: { type: string, example: '2026-10-04T19:00:00Z' }
                end_time: { type: string, example: '2026-10-04T20:00:00Z' }
                racket_count: { type: integer }
                shuttle_count: { type: integer }
      responses:
        '200': { description: OK }

  /bookings:
    post:
      tags: [bookings]
      summary: 创建预约（held 待支付；Redis 锁 + PG GiST 排他约束防重）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/Booking' }
                  price_text: { type: string }
                  payment_deadline: { type: string, format: date-time }
        '409': { description: SLOT_LOCKED / SLOT_TAKEN 场地时段被锁定或冲突 }
        '422': { description: 维护/非营业时间/会员优先/超提前量等业务拒绝 }
  /me/bookings:
    get:
      tags: [bookings]
      summary: 我的预约
      responses:
        '200': { description: OK }
  /bookings/{id}:
    get:
      tags: [bookings]
      summary: 预约详情（会员仅本人，员工任意）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
  /bookings/{id}/pay:
    post:
      tags: [bookings]
      summary: 支付（mock 网关；held -> paid；同时核销权益）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, default: mock }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '409': { description: 非可支付状态或支付已超时 }
  /bookings/{id}/quote-cancel:
    post:
      tags: [bookings]
      summary: 退订报价（按平峰/高峰分档退款比例）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: 退订（held 直接释放；paid/warming 按规则退款）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: OK }
  /bookings/{id}/checkin:
    post:
      tags: [bookings]
      summary: 前台人工签到（front/operator）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /bookings/{id}/light:
    post:
      tags: [bookings]
      summary: "灯控指令（warmup/on/off；source: scheduler/device/front/operator/system）"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [warmup, on, off] }
                source: { type: string, enum: [scheduler, device, front, operator, system] }
                detail: { type: string }
      responses:
        '200': { description: OK }
  /bookings/{id}/session/start:
    post:
      tags: [bookings]
      summary: 确认开打（开灯并进入 in_use；前一场延时导致晚开自动补偿等额时长）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /bookings/{id}/session/end:
    post:
      tags: [bookings]
      summary: 结束场次并结算（延时费按 15 分钟向上取整，补偿时长先抵扣；超员费另计）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [onsite, member_pay, system_pending], description: 延时费收取方式 }
      responses:
        '200': { description: OK }
  /bookings/{id}/participants:
    post:
      tags: [bookings]
      summary: 拼场加入人员（会员带朋友）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                member_id: { type: integer, format: int64 }
      responses:
        '201': { description: OK }
  /bookings/{id}/headcount:
    post:
      tags: [bookings]
      summary: 前台核对实际人数，超员计费（front/operator）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_count]
              properties:
                actual_count: { type: integer }
      responses:
        '200': { description: OK }
  /bookings/{id}/waive-overlimit:
    post:
      tags: [bookings]
      summary: 前台减免超员费
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /bookings/{id}/compensation:
    post:
      tags: [bookings]
      summary: 临时补偿时长（scope=current 延长本场；scope=future 发补偿券）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, scope]
              properties:
                minutes: { type: integer }
                scope: { type: string, enum: [current, future] }
                reason: { type: string }
      responses:
        '200': { description: OK }
  /bookings/{id}/refund-requests:
    post:
      tags: [bookings]
      summary: 会员发起退款申请（爽约争议的重要证据）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, reason]
              properties:
                amount_cents: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '201': { description: OK }
  /bookings/{id}/timeline:
    get:
      tags: [bookings]
      summary: >
        客服全景时间线（预约+支付+闸机+灯控+前台+事件+维护+裁决建议）。
        临时换场场景额外返回：device_permission_sync（闸机/灯控权限旧场 revoke、新场 grant 同步记录）、
        vacate_reminders（旧场地清场提醒）、relocated_from/relocated_to（换场链路对端订单）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /bookings/{id}/verdict:
    get:
      tags: [bookings]
      summary: 爽约/迟到/场馆原因判定建议（不落库）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }

  /bookings/{id}/relocation/options:
    get:
      tags: [relocation]
      summary: >
        查询临时换场候选（仅 relocation_pending 订单）：筛选同场馆、同时间（或指定顺延时间）
        容量足够、无预约且无维护的可用场地，并给出差价（price_diff_cents>0 由场馆承担，
        <0 退还会员）。传 start_time+end_time 可查顺延候选。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK }
        '409': { description: 订单不处于换场处理中 }
  /bookings/{id}/relocation/resolve:
    post:
      tags: [relocation]
      summary: >
        确认换场方案。choice=move 换至 court_id 同时段场地（差价场馆承担/退还）；
        postpone 顺延至 court_id + start_time/end_time；refund 场馆原因全额退款。
        确认后同步闸机/灯控权限（旧场地 revoke、新场地 grant）；若会员已进入旧场地则生成清场提醒。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [move, postpone, refund] }
                court_id: { type: integer, format: int64 }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
                note: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: 状态不允许或目标场地时段冲突 }

  /devices/gate/scan:
    post:
      tags: [devices]
      security: []
      summary: 闸机扫码（返回 allowed/waiting/denied；每次扫码留痕）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_code]
              properties:
                entry_code: { type: string }
                device_id: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [allowed, waiting, denied] }
                  reason: { type: string }
                  booking: { $ref: '#/components/schemas/Booking' }
  /devices/light/{bookingId}:
    post:
      tags: [devices]
      security: []
      summary: 设备灯控直连指令
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [warmup, on, off] }
                source: { type: string }
                detail: { type: string }
      responses:
        '200': { description: OK }

  /operator/maintenances:
    get:
      tags: [operator]
      summary: 维护记录列表
      parameters:
        - { name: venue_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
    post:
      tags: [operator]
      summary: 创建维护锁定（覆盖订单：held 释放；paid/warming/in_use 进入 relocation_pending 等用户换场/顺延/退款）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, court_id, start_time, end_time]
              properties:
                venue_id: { type: integer, format: int64 }
                court_id: { type: integer, format: int64 }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '201': { description: OK }
  /operator/maintenances/{id}/release:
    post:
      tags: [operator]
      summary: 提前解除维护（误登记撤销；场地恢复开放）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /operator/maintenances/{id}/repair-complete:
    post:
      tags: [operator]
      summary: 维修完工上报（active -> repair_done；场地仍锁定，需前台验收后才重新开放预约）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
        '409': { description: 当前状态不可上报完工 }
  /operator/maintenances/{id}/verify:
    post:
      tags: [operator]
      summary: 前台验收确认（front/operator）。passed=true -> verified 且场地重新开放；false -> 退回 active 重修
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passed]
              properties:
                passed: { type: boolean, description: 验收是否通过 }
                note: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: 维护单状态不允许验收 }
  /operator/courts/{id}/price:
    post:
      tags: [operator]
      summary: 设置场地专属平时价（分/小时，0 恢复场馆基础价）；换至高价场地的差价由场馆承担
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_cents_per_hour]
              properties:
                price_cents_per_hour: { type: integer, format: int64, example: 9000 }
      responses:
        '200': { description: OK }

  /front/vacate-reminders:
    get:
      tags: [relocation]
      summary: 旧场地清场提醒列表（status 可选 pending/cleared）
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, cleared] } }
      responses:
        '200': { description: OK }
  /front/vacate-reminders/{id}/clear:
    post:
      tags: [relocation]
      summary: 前台确认用户已离开旧场地，关闭清场提醒
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /operator/extra-slots:
    post:
      tags: [operator]
      summary: 临时加场（营业时段外开放）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, slot_date, opens_at, closes_at]
              properties:
                venue_id: { type: integer, format: int64 }
                court_id: { type: integer, format: int64 }
                slot_date: { type: string, format: date }
                opens_at: { type: string, example: '22:00' }
                closes_at: { type: string, example: '23:30' }
                note: { type: string }
      responses:
        '201': { description: OK }
  /operator/rules/cancellation:
    post:
      tags: [operator]
      summary: 设置退订规则（平峰/高峰、距开场小时数、退款百分比）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, is_peak, min_hours_before, refund_percent]
              properties:
                venue_id: { type: integer, format: int64 }
                is_peak: { type: boolean }
                min_hours_before: { type: number }
                refund_percent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: OK }

  /cs/disputes:
    get:
      tags: [cs]
      summary: 争议单列表（status 可选 open/resolved）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: ['', open, resolved] } }
      responses:
        '200': { description: OK }
    post:
      tags: [cs]
      summary: 人工开立争议单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, issue]
              properties:
                booking_id: { type: integer, format: int64 }
                issue: { type: string }
      responses:
        '201': { description: OK }
  /cs/disputes/{id}/resolve:
    post:
      tags: [cs]
      summary: >
        客服处理：refund 全额退 / partial_refund 部分退 / comp_minutes 补偿时长券 /
        rescind_noshow 撤销爽约并返还次数 / mixed 部分退+补偿 / reject 驳回
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [refund, partial_refund, comp_minutes, rescind_noshow, mixed, reject]
                refund_cents: { type: integer, format: int64 }
                comp_minutes: { type: integer }
                note: { type: string }
      responses:
        '200': { description: OK }

  /internal/jobs/relocation-timeout:
    post:
      tags: [internal]
      security: []
      summary: 扫描超过确认截止时间仍未选择方案的换场订单，按场馆原因自动全额退款
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterReq:
      type: object
      required: [phone, name]
      properties:
        phone: { type: string, example: "13900001111" }
        name: { type: string }
        password: { type: string, description: 缺省 123456 }
        member_type: { type: string, enum: [normal, silver, gold], default: normal }
    LoginResp:
      type: object
      properties:
        token: { type: string }
        member: { type: object, nullable: true }
        staff: { type: object, nullable: true }
    CreateBookingReq:
      type: object
      required: [venue_id, court_id, start_time, end_time, party_size]
      properties:
        idempotency_key: { type: string, description: 客户端幂等键，重试安全 }
        venue_id: { type: integer, format: int64 }
        court_id: { type: integer, format: int64 }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        party_size: { type: integer }
        rent_racket: { type: boolean }
        racket_count: { type: integer }
        buy_shuttle: { type: boolean }
        shuttle_count: { type: integer }
        note: { type: string }
    Booking:
      type: object
      properties:
        id: { type: integer, format: int64 }
        booking_no: { type: string }
        venue_id: { type: integer, format: int64 }
        court_id: { type: integer, format: int64 }
        member_id: { type: integer, format: int64 }
        member_type_snap: { type: string }
        party_size: { type: integer }
        capacity_snapshot: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        court_fee_cents: { type: integer, format: int64 }
        addon_cents: { type: integer, format: int64 }
        discount_cents: { type: integer, format: int64 }
        benefit_cents: { type: integer, format: int64 }
        benefit_minutes: { type: integer }
        overlimit_cents: { type: integer, format: int64 }
        payable_cents: { type: integer, format: int64 }
        paid_cents: { type: integer, format: int64 }
        refunded_cents: { type: integer, format: int64 }
        overtime_cents: { type: integer, format: int64 }
        late_adjust_cents: { type: integer, format: int64 }
        status:
          type: string
          enum: [held, paid, warming, in_use, completed, cancelled, expired, no_show, venue_fault, disputed, relocation_pending, moved]
        relocation_status: { type: string, enum: ['', pending, resolved] }
        relocation_maintenance_id: { type: integer, format: int64, nullable: true }
        original_court_id: { type: integer, format: int64, nullable: true }
        relocated_from_booking_id: { type: integer, format: int64, nullable: true }
        relocated_to_booking_id: { type: integer, format: int64, nullable: true }
        relocation_due_at: { type: string, format: date-time, nullable: true }
        venue_borne_cents: { type: integer, format: int64, description: 换至高价场地由场馆承担的差价 }
        vacate_reminded_at: { type: string, format: date-time, nullable: true }
        entry_code: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        first_gate_at: { type: string, format: date-time, nullable: true }
        gate_waiting_at: { type: string, format: date-time, nullable: true }
        front_checkin_at: { type: string, format: date-time, nullable: true }
        first_presence_at: { type: string, format: date-time, nullable: true }
        warmup_at: { type: string, format: date-time, nullable: true }
        light_on_at: { type: string, format: date-time, nullable: true }
        light_off_at: { type: string, format: date-time, nullable: true }
        effective_start: { type: string, format: date-time, nullable: true }
        actual_end: { type: string, format: date-time, nullable: true }
        overtime_minutes: { type: integer }
        late_start_minutes: { type: integer }
        comp_bonus_minutes: { type: integer }
        overlimit_persons: { type: integer }
        verdict:
          type: string
          nullable: true
          enum: [on_time, late, no_show, venue_fault, ambiguous, excused, moved]
        judge_source: { type: string, nullable: true }
        note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
